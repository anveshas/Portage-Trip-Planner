name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go gate tests
        working-directory: gate
        run: go test ./...
      - name: Django tests
        working-directory: web
        run: |
          pip install -r requirements.txt
          python manage.py test
